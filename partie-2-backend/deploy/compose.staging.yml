# Sawtna AI — staging du backend (étudiant 2) sur une VM Azure.
# PostgreSQL/pgvector reste privé (aucun port publié). Seul Caddy (HTTPS) est exposé.
# NLP tourne ici en attendant son déploiement Cloud Run (étudiant 3).
name: sawtna-staging
x-app: &app
  build:
    context: ./sawtna-ai
    dockerfile: commun/infra/Dockerfile
  image: sawtna-app:staging
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 4s
    retries: 15
    start_period: 15s
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sawtna
      POSTGRES_USER: sawtna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sawtna -d sawtna"]
      interval: 5s
      timeout: 3s
      retries: 20
  nlp:
    <<: *app
    environment:
      SAWTNA_SERVICE: nlp
      SAWTNA_SERVICE_KEY: ${SAWTNA_SERVICE_KEY:?}
      SAWTNA_EMBEDDER: concept-hash-v1
  backend:
    <<: *app
    environment:
      SAWTNA_SERVICE: backend
      SAWTNA_SERVICE_KEY: ${SAWTNA_SERVICE_KEY:?}
      SAWTNA_ADMIN_KEY: ${SAWTNA_ADMIN_KEY:?}
      SAWTNA_BACKEND_DATABASE_URL: postgresql://sawtna:${POSTGRES_PASSWORD}@db:5432/sawtna
      SAWTNA_NLP_URL: http://nlp:8000
      # Analytics (étudiant 5) pas encore déployé : les événements restent en file de réessai.
      SAWTNA_ANALYTICS_URL: ${SAWTNA_ANALYTICS_URL:-http://analytics.invalid:8000}
      SAWTNA_ALLOWED_ORIGINS: ${SAWTNA_ALLOWED_ORIGINS:-https://localhost}
    depends_on:
      db: {condition: service_healthy}
      nlp: {condition: service_healthy}
  caddy:
    image: caddy:2.8.4
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SAWTNA_DOMAIN: ${SAWTNA_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
  caddy_data:

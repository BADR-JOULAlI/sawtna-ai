name: Local multi-service validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[test]"
      - run: npm --prefix partie-4-frontend ci
      - run: python -m pytest
      - run: docker compose up --build --detach --wait
      - run: python commun/scripts/smoke.py
      - run: python commun/scripts/evaluate.py
      - working-directory: partie-4-frontend
        run: npx playwright install --with-deps chromium
      - working-directory: partie-4-frontend
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-verification
          path: commun/docs/verification/
      - if: always()
        run: docker compose stop
